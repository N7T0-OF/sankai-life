name: Compiler l'APK

# Quand la compilation se déclenche :
#  - à chaque envoi de code sur main        -> APK de test dans les Artifacts
#  - à chaque tag « v… » (ex : v1.0.0)      -> Release avec l'APK téléchargeable
#  - manuellement depuis l'onglet Actions   -> APK de test
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

# Publier main et son tag envoie deux fois le même commit, à une seconde
# d'intervalle. Les deux exécutions partagent alors le cache Gradle et
# s'écrivent dessus : le 1er août 2026, le même commit a réussi côté tag et
# échoué côté main, à l'étape des tests, sans qu'aucun test ne soit en cause
# (suite rejouée trois fois en local, 267 tests verts à chaque passe).
#
# Le regroupement se fait sur le commit, pas sur la référence : c'est le
# commit qui est identique, pas la branche. `cancel-in-progress: false` est
# essentiel — annuler ferait tomber la publication de la Release, qui n'a lieu
# que sur le tag.
concurrency:
  group: compilation-${{ github.sha }}
  cancel-in-progress: false

jobs:

  # =====================================================================
  # APK de test — à chaque envoi de code. Aucun secret nécessaire.
  # Récupérable dans Actions > (le run) > Artifacts.
  # =====================================================================
  apk:
    name: APK de test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer les composants Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Rendre gradlew exécutable
        run: chmod +x SankaiLife/gradlew

      # Les tests avant la compilation : inutile de produire un APK dont la
      # logique de progression est fausse.
      - name: Lancer les tests unitaires
        working-directory: SankaiLife
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Publier le rapport de tests en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-tests
          path: SankaiLife/app/build/reports/tests/
          retention-days: 14

      - name: Compiler l'APK de debug
        working-directory: SankaiLife
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer l'artefact
        run: |
          mkdir -p artefacts
          cp SankaiLife/app/build/outputs/apk/debug/*.apk \
             "artefacts/SankaiLife-debug-${GITHUB_SHA:0:7}.apk"

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: SankaiLife-APK-debug
          path: artefacts/*.apk
          retention-days: 90

  # =====================================================================
  # Release — uniquement sur un tag « v… ».
  # Produit TOUJOURS un APK installable et l'attache à la Release GitHub.
  # Si les secrets de signature existent, l'APK est signé avec la vraie
  # clé et l'AAB pour le Play Store est ajouté.
  # =====================================================================
  publier:
    name: Publier la Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: apk
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer les composants Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Reconstituer la clé de signature
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Secrets de signature incomplets : publication annulée."
            exit 1
          fi
          mkdir -p cles
          echo "$KEYSTORE_BASE64" | base64 -d > cles/sankai-release.jks
          {
            echo "storeFile=../cles/sankai-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > SankaiLife/keystore.properties
          echo "signee=true" >> "$GITHUB_OUTPUT"

      - name: Injecter les identifiants AdMob
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
        run: |
          # Les secrets surchargent les identifiants du dépôt quand ils
          # existent. Absents, la compilation reprend ceux de build.gradle.kts,
          # qui sont les vrais identifiants de production — ils ne sont pas
          # secrets, un APK distribué les expose de toute façon.
          #
          # Ce qui doit rester impossible, c'est de publier avec les
          # identifiants de TEST : ADMOB_IS_REAL le détecte côté application.
          if [ -z "$ADMOB_APP_ID" ] || [ -z "$ADMOB_REWARDED_UNIT_ID" ]; then
            echo "::warning::Secrets AdMob absents : compilation avec les identifiants du dépôt."
            exit 0
          fi
          {
            echo "ADMOB_APP_ID=$ADMOB_APP_ID"
            echo "ADMOB_REWARDED_UNIT_ID=$ADMOB_REWARDED_UNIT_ID"
          } > SankaiLife/admob.properties

      - name: Rendre gradlew exécutable
        run: chmod +x SankaiLife/gradlew

      - name: Compiler l'APK de release
        working-directory: SankaiLife
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Compiler l'AAB pour le Play Store
        if: steps.signature.outputs.signee == 'true'
        working-directory: SankaiLife
        run: ./gradlew bundleRelease --no-daemon

      - name: Rassembler les fichiers
        run: |
          mkdir -p artefacts
          cp SankaiLife/app/build/outputs/apk/release/*.apk \
             "artefacts/SankaiLife-${GITHUB_REF_NAME}.apk"
          if [ -d SankaiLife/app/build/outputs/bundle/release ]; then
            cp SankaiLife/app/build/outputs/bundle/release/*.aab \
               "artefacts/SankaiLife-${GITHUB_REF_NAME}-playstore.aab" || true
          fi
          ls -lh artefacts

      # update.json est lu par l'application pour décider s'il existe une
      # version plus récente. Le versionCode y figure parce que comparer des
      # noms de version textuels est fragile, et le SHA-256 permet à l'app de
      # refuser un fichier corrompu ou substitué.
      - name: Générer update.json et l'empreinte
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK="artefacts/SankaiLife-${GITHUB_REF_NAME}.apk"
          VERSION_CODE=$(grep -oE 'versionCode *= *[0-9]+' SankaiLife/app/build.gradle.kts | grep -oE '[0-9]+' | head -1)
          VERSION_NAME=$(grep -oE 'versionName *= *"[^"]+"' SankaiLife/app/build.gradle.kts | sed 's/.*"\(.*\)"/\1/' | head -1)
          SHA=$(sha256sum "$APK" | cut -d' ' -f1)
          TAILLE=$(stat -c%s "$APK")

          echo "$SHA  $(basename "$APK")" > "artefacts/$(basename "$APK").sha256"

          # Notes de version : lues via l'API GitHub, PAS via git.
          #
          # actions/checkout ne matérialise pas l'objet de tag annoté, même
          # avec fetch-depth 0 : `git for-each-ref %(contents)` retombe alors
          # silencieusement sur le message du commit, et le changelog affiché
          # dans l'application devient du texte destiné à l'historique Git.
          # L'API renvoie le message du tag lui-même, sans ambiguïté.
          CORPS=""
          REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${GITHUB_REF_NAME}" 2>/dev/null || echo '{}')
          TYPE=$(echo "$REF" | jq -r '.object.type // empty')
          SHA_TAG=$(echo "$REF" | jq -r '.object.sha // empty')
          if [ "$TYPE" = "tag" ] && [ -n "$SHA_TAG" ]; then
            # tail -n +2 retire la première ligne, qui sert de titre.
            CORPS=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${SHA_TAG}" --jq '.message' | tail -n +2)
          fi

          CHANGELOG=$(echo "$CORPS" | grep -v '^$' | head -8 | jq -R . | jq -s .)
          if [ "$CHANGELOG" = "[]" ] || [ -z "$CHANGELOG" ]; then
            CHANGELOG='["Mise à jour de Sankai Life"]'
          fi

          jq -n \
            --argjson versionCode "$VERSION_CODE" \
            --arg versionName "$VERSION_NAME" \
            --arg sha256 "$SHA" \
            --argjson size "$TAILLE" \
            --arg apkUrl "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$APK")" \
            --argjson changelog "$CHANGELOG" \
            '{versionCode: $versionCode, versionName: $versionName, sha256: $sha256, sizeBytes: $size, apkUrl: $apkUrl, changelog: $changelog}' \
            > artefacts/update.json

          cat artefacts/update.json

      - name: Rédiger les notes de version
        env:
          SIGNEE: ${{ steps.signature.outputs.signee }}
        run: |
          TAILLE=$(du -h artefacts/SankaiLife-${GITHUB_REF_NAME}.apk | cut -f1)
          {
            echo "## Installation"
            echo ""
            echo "1. Télécharge \`SankaiLife-${GITHUB_REF_NAME}.apk\` ci-dessous, depuis ton téléphone"
            echo "2. Ouvre le fichier téléchargé"
            echo "3. Autorise l'installation depuis cette source si Android le demande"
            echo ""
            echo "Taille : $TAILLE • Android 8.0 minimum"
            echo ""
            echo "## Ce que fait l'application"
            echo ""
            echo "Productivité gamifiée, **100 % hors ligne** : mémos intelligents à partir"
            echo "de textes collés, minuteur de concentration, objectifs, défis quotidiens,"
            echo "coffres et progression par niveaux."
            echo ""
            if [ "$SIGNEE" = "true" ]; then
              echo "## Signature"
              echo ""
              echo "APK signé avec la clé de production. Les mises à jour s'installeront"
              echo "par-dessus les versions précédentes."
            fi
          } > notes.md
          cat notes.md

      - name: Créer la Release et y attacher les fichiers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --title "Sankai Life $TAG" --notes-file notes.md
          else
            gh release edit "$TAG" --notes-file notes.md
          fi
          gh release upload "$TAG" artefacts/* --clobber

      - name: Effacer les secrets reconstitués
        if: always()
        run: rm -f cles/sankai-release.jks SankaiLife/keystore.properties SankaiLife/admob.properties

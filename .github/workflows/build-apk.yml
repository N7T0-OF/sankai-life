name: Compiler l'APK

# Quand la compilation se déclenche :
#  - à chaque envoi de code sur main
#  - manuellement, depuis l'onglet Actions (bouton « Run workflow »)
#  - à la publication d'une Release (les fichiers y sont alors attachés)
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:

  # ---------------------------------------------------------------------
  # APK de test — toujours compilé, aucun secret nécessaire.
  # Récupérable dans Actions > (le run) > Artifacts.
  # ---------------------------------------------------------------------
  debug:
    name: APK de test
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer les composants Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Rendre gradlew exécutable
        run: chmod +x SankaiLife/gradlew

      - name: Compiler l'APK de debug
        working-directory: SankaiLife
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Préparer l'artefact
        run: |
          mkdir -p artefacts
          cp SankaiLife/app/build/outputs/apk/debug/*.apk \
             "artefacts/SankaiLife-debug-${GITHUB_SHA:0:7}.apk"

      - name: Publier l'APK téléchargeable
        uses: actions/upload-artifact@v4
        with:
          name: SankaiLife-APK-debug
          path: artefacts/*.apk
          retention-days: 90

  # ---------------------------------------------------------------------
  # APK + AAB signés — uniquement si les secrets de signature existent.
  # Sans eux, ce job réussit en ne faisant rien : le dépôt reste utilisable
  # par quelqu'un qui n'a pas la clé.
  # ---------------------------------------------------------------------
  release:
    name: APK + AAB signés
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer le JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Installer les composants Android SDK
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Reconstituer la clé de signature
        id: signature
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "pret=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secret KEYSTORE_BASE64 absent — build signé ignoré."
            exit 0
          fi
          mkdir -p cles
          echo "$KEYSTORE_BASE64" | base64 -d > cles/sankai-release.jks
          {
            echo "storeFile=../cles/sankai-release.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > SankaiLife/keystore.properties
          echo "pret=true" >> "$GITHUB_OUTPUT"

      - name: Injecter les identifiants AdMob
        if: steps.signature.outputs.pret == 'true'
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_UNIT_ID: ${{ secrets.ADMOB_REWARDED_UNIT_ID }}
        run: |
          if [ -z "$ADMOB_APP_ID" ]; then
            echo "::notice::Secrets AdMob absents — identifiants de TEST utilisés."
            exit 0
          fi
          {
            echo "ADMOB_APP_ID=$ADMOB_APP_ID"
            echo "ADMOB_REWARDED_UNIT_ID=$ADMOB_REWARDED_UNIT_ID"
          } > SankaiLife/admob.properties

      - name: Rendre gradlew exécutable
        if: steps.signature.outputs.pret == 'true'
        run: chmod +x SankaiLife/gradlew

      - name: Compiler l'APK et l'AAB signés
        if: steps.signature.outputs.pret == 'true'
        working-directory: SankaiLife
        run: ./gradlew assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Préparer les artefacts
        if: steps.signature.outputs.pret == 'true'
        run: |
          mkdir -p artefacts
          VERSION="${GITHUB_REF_NAME//\//-}"
          cp SankaiLife/app/build/outputs/apk/release/*.apk \
             "artefacts/SankaiLife-$VERSION.apk"
          cp SankaiLife/app/build/outputs/bundle/release/*.aab \
             "artefacts/SankaiLife-$VERSION-playstore.aab"

      - name: Publier les fichiers signés
        if: steps.signature.outputs.pret == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: SankaiLife-signe
          path: artefacts/*
          retention-days: 90

      - name: Joindre les fichiers à la Release
        if: github.event_name == 'release' && steps.signature.outputs.pret == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" artefacts/*

      - name: Effacer les secrets reconstitués
        if: always()
        run: rm -f cles/sankai-release.jks SankaiLife/keystore.properties SankaiLife/admob.properties
